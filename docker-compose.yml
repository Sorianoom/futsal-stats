services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: futsal
      POSTGRES_PASSWORD: futsal
      POSTGRES_DB: futsal
    ports:
      - "54329:5432"
    volumes:
      - futsal_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futsal -d futsal"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Dentro de la red de compose la BD es "db:5432", no localhost:54329.
      DATABASE_URL: postgresql+asyncpg://futsal:futsal@db:5432/futsal
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # El navegador es quien llama a la API, así que usa la dirección publicada en el host.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend

volumes:
  futsal_pgdata:
  frontend_node_modules:
  frontend_next_cache:
