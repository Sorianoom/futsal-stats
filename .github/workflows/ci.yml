name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: futsal
          POSTGRES_PASSWORD: futsal
          POSTGRES_DB: futsal_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U futsal -d futsal_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://futsal:futsal@localhost:54329/futsal_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      # LayoutProps y similares los genera Next; en un checkout limpio hay que pedirlos.
      - run: yarn next typegen
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
        env:
          # El build de producción exige una URL https; aquí solo comprueba que compila.
          NEXT_PUBLIC_API_URL: https://api.example.com
